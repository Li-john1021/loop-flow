name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate schemas, examples, commands, and semantics
        run: python -B scripts/validate.py --root . --require-jsonschema
      - name: Run validator tests
        run: python -B -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -B -m compileall -q scripts tests
